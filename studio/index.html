<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JR Studio - Live Host Editor</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- PeerJS for direct browser-to-browser P2P -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    #editor-panel {
      position: absolute; top: 15px; left: 15px; z-index: 9999;
      background: rgba(26, 32, 44, 0.95); color: white; padding: 15px;
      border-radius: 12px; width: 290px; font-family: sans-serif;
    }
    .room-code { background: #2b6cb0; padding: 8px; border-radius: 4px; font-weight: bold; text-align: center; }
    button { width: 100%; margin: 5px 0; padding: 8px; background: #ff5722; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="editor-panel">
    <h2>🛠️ JR Studio (Host)</h2>
    <div>Room Code: <div id="host-id" class="room-code">Generating...</div></div>
    
    <hr>
    
    <button id="add-box-btn">Spawn Box</button>
    <button onclick="location.href='./'" style="background:#4a5568;">Back to Main Game</button>
  </div>

  <a-scene>
    <a-sky color="#61C3FF"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#2d3748"></a-plane>
    <a-entity id="builder-container"></a-entity>
    
    <!-- Editor Camera -->
    <a-entity position="0 1.6 0" camera look-controls wasd-controls></a-entity>
  </a-scene>

  <script>
    const connectedPeers = [];
    
    // 1. Initialize Host Peer
    const peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('host-id').innerText = id;
    });

    // 2. Handle incoming client connections
    peer.on('connection', (conn) => {
      connectedPeers.push(conn);

      conn.on('data', (data) => {
        if (data.type === 'PLAYER_MOVE') {
          updateRemotePlayer(conn.peer, data.position);
        }
      });

      conn.on('close', () => {
        removeRemotePlayer(conn.peer);
      });
    });

    // 3. Broadcast spawned objects to all connected players
    document.getElementById('add-box-btn').addEventListener('click', () => {
      const objData = { type: 'box', color: '#ff5722', position: '0 1 -4' };
      
      // Render on host
      renderObject(objData);

      // Broadcast to players connected to editor's PC
      connectedPeers.forEach(conn => {
        conn.send({ type: 'SPAWN_OBJECT', data: objData });
      });
    });

    function renderObject(data) {
      const el = document.createElement(`a-${data.type}`);
      el.setAttribute('position', data.position);
      el.setAttribute('color', data.color);
      document.getElementById('builder-container').appendChild(el);
    }

    function updateRemotePlayer(peerId, pos) {
      let player = document.getElementById(`player-${peerId}`);
      if (!player) {
        player = document.createElement('a-sphere');
        player.id = `player-${peerId}`;
        player.setAttribute('radius', '0.4');
        player.setAttribute('color', '#38a169');
        document.querySelector('a-scene').appendChild(player);
      }
      player.setAttribute('position', pos);
    }

    function removeRemotePlayer(peerId) {
      const player = document.getElementById(`player-${peerId}`);
      if (player) player.remove();
    }
  </script>
</body>
</html>
