<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rec Engine - Maker Pen Studio</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; color: #fff; }
    
    #maker-palette {
      position: absolute; top: 20px; left: 20px; width: 320px; height: calc(100vh - 40px);
      background: rgba(30, 30, 30, 0.95); border: 3px solid #444; border-radius: 16px;
      display: flex; flex-direction: column; z-index: 100; backdrop-filter: blur(8px);
    }
    .palette-header { background: #ff8800; padding: 12px; border-radius: 12px 12px 0 0; text-align: center; font-weight: 900; font-size: 16px; }
    .tabs { display: flex; background: #222; border-bottom: 2px solid #444; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: #aaa; }
    .tab.active { color: #ff8800; background: #333; border-bottom: 2px solid #ff8800; }
    
    .palette-content { padding: 12px; flex: 1; overflow-y: auto; }
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .tool-btn { background: #444; border: 1px solid #555; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; font-size: 13px; }
    .tool-btn:hover { background: #ff8800; color: #000; }
    
    .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: #222; padding: 6px; border-radius: 6px; }
    .prop-row input { width: 55%; background: #111; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; }

    .publish-btn { background: #28a745; padding: 12px; text-align: center; font-weight: 900; border-radius: 0 0 12px 12px; cursor: pointer; }
    #nav-buttons { position: absolute; top: 20px; right: 20px; z-index: 100; }
    .nav-btn { background: #444; border: 2px solid #555; color: white; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="nav-buttons">
    <button class="nav-btn" onclick="window.location.href='./index.html'">Back to Dorm</button>
  </div>

  <div id="maker-palette">
    <div class="palette-header">MAKER PEN PALETTE</div>
    
    <div class="tabs">
      <div class="tab active" id="tab-btn-palette">Palette</div>
      <div class="tab" id="tab-btn-tools">Shapes</div>
      <div class="tab" id="tab-btn-config">Config</div>
    </div>

    <div class="palette-content" id="tab-palette">
      <div style="font-size:12px; color:#ff8800; font-weight:bold; margin-bottom:8px;">CREATE SHAPES</div>
      <div class="tool-grid">
        <div class="tool-btn" id="create-box">Cube</div>
        <div class="tool-btn" id="create-sphere">Sphere</div>
        <div class="tool-btn" id="create-cylinder">Cylinder</div>
        <div class="tool-btn" id="create-cone">Cone</div>
      </div>
      <div style="font-size:12px; color:#ff8800; font-weight:bold; margin-bottom:8px;">COLOR</div>
      <input type="color" id="maker-color" value="#ff8800" style="width:100%; height:40px; border:none; border-radius:6px; cursor:pointer;">
    </div>

    <div class="palette-content" id="tab-tools" style="display:none;">
      <div id="hierarchy-list"><i style="color:#666; font-size:12px;">No shapes drawn.</i></div>
    </div>

    <div class="palette-content" id="tab-config" style="display:none;">
      <div id="inspector-content"><i style="color:#666; font-size:12px;">Select a shape in the scene.</i></div>
    </div>

    <div class="publish-btn" id="btn-save-publish">Save & Copy Payload</div>
  </div>

  <a-scene embedded>
    <a-sky color="#222"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#333" gridhelper="size: 30; divisions: 30;"></a-plane>
    <a-ambient-light intensity="0.7"></a-ambient-light>
    <a-camera position="0 1.6 3" look-controls wasd-controls>
      <a-cursor color="#ff8800" raycaster="objects: .clickable"></a-cursor>
    </a-camera>
    <a-entity id="ink-space"></a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let shapes = [];
      let activeShapeId = null;

      const switchTab = (target) => {
        ["palette", "tools", "config"].forEach(t => {
          document.getElementById(`tab-${t}`).style.display = t === target ? "block" : "none";
          document.getElementById(`tab-btn-${t}`).classList.toggle("active", t === target);
        });
      };

      document.getElementById("tab-btn-palette").onclick = () => switchTab("palette");
      document.getElementById("tab-btn-tools").onclick = () => switchTab("tools");
      document.getElementById("tab-btn-config").onclick = () => switchTab("config");

      const addShape = (type) => {
        const id = "shape_" + Date.now();
        const color = document.getElementById("maker-color").value;
        const el = document.createElement("a-entity");

        el.setAttribute("id", id);
        el.setAttribute("geometry", { primitive: type });
        el.setAttribute("material", { color: color });
        el.setAttribute("position", `0 ${1 + shapes.length * 0.4} -2`);
        el.classList.add("clickable");

        el.addEventListener("click", () => selectShape(id));
        document.getElementById("ink-space").appendChild(el);

        shapes.push({ id, type, color, el });
        updateHierarchy();
        selectShape(id);
      };

      ["box", "sphere", "cylinder", "cone"].forEach(type => {
        document.getElementById(`create-${type}`).onclick = () => addShape(type);
      });

      const selectShape = (id) => {
        activeShapeId = id;
        updateHierarchy();
        const item = shapes.find(s => s.id === id);
        if (!item) return;

        const pos = item.el.getAttribute("position");
        const inspector = document.getElementById("inspector-content");
        inspector.innerHTML = `
          <div class="prop-row"><label>X</label><input type="number" step="0.1" id="p-x" value="${pos.x}"></div>
          <div class="prop-row"><label>Y</label><input type="number" step="0.1" id="p-y" value="${pos.y}"></div>
          <div class="prop-row"><label>Z</label><input type="number" step="0.1" id="p-z" value="${pos.z}"></div>
          <button id="btn-del-shape" style="width:100%; background:#d9534f; color:#fff; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">Delete</button>
        `;

        ["x", "y", "z"].forEach(axis => {
          document.getElementById(`p-${axis}`).oninput = (e) => {
            const current = item.el.getAttribute("position");
            current[axis] = parseFloat(e.target.value) || 0;
            item.el.setAttribute("position", current);
          };
        });

        document.getElementById("btn-del-shape").onclick = () => {
          item.el.parentNode.removeChild(item.el);
          shapes = shapes.filter(s => s.id !== id);
          inspector.innerHTML = `<i style="color:#666; font-size:12px;">Select a shape in the scene.</i>`;
          updateHierarchy();
        };

        switchTab("config");
      };

      const updateHierarchy = () => {
        const list = document.getElementById("hierarchy-list");
        list.innerHTML = "";
        if (!shapes.length) {
          list.innerHTML = `<i style="color:#666; font-size:12px;">No shapes drawn.</i>`;
          return;
        }
        shapes.forEach(s => {
          const div = document.createElement("div");
          div.style.padding = "6px";
          div.style.marginBottom = "4px";
          div.style.background = s.id === activeShapeId ? "#ff8800" : "#222";
          div.style.color = s.id === activeShapeId ? "#000" : "#fff";
          div.style.borderRadius = "4px";
          div.style.cursor = "pointer";
          div.style.fontSize = "12px";
          div.style.fontWeight = "bold";
          div.textContent = `Shape (${s.type})`;
          div.onclick = () => selectShape(s.id);
          list.appendChild(div);
        });
      };

      document.getElementById("btn-save-publish").onclick = async () => {
        const payload = JSON.stringify({
          metadata: { name: "^CustomRoom" },
          entities: shapes.map(s => ({
            type: s.type,
            color: s.color,
            position: s.el.getAttribute("position")
          }))
        });
        
        try {
          await navigator.clipboard.writeText(payload);
          alert("Room JSON copied to clipboard!");
        } catch(err) {
          console.log(payload);
          alert("Payload logged to developer browser console!");
        }
      };
    });
  </script>
</body>
</html>
