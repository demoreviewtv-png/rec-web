<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rec Engine - Studio Editor</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #181818; color: #eee; }
    #editor-layout { display: grid; grid-template-columns: 240px 1fr 300px; grid-template-rows: 48px 1fr 160px; height: 100vh; }
    #toolbar { grid-column: 1 / -1; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
    button { background: #333; color: #fff; border: 1px solid #454545; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:hover { background: #007acc; }
    #hierarchy { background: #1e1e1e; border-right: 1px solid #3c3c3c; padding: 10px; overflow-y: auto; }
    #viewport-container { grid-column: 2; grid-row: 2; position: relative; }
    #inspector { background: #1e1e1e; border-left: 1px solid #3c3c3c; padding: 10px; grid-column: 3; grid-row: 2 / -1; }
    #bottom-panel { grid-column: 1 / 3; grid-row: 3; background: #181818; border-top: 1px solid #3c3c3c; padding: 10px; }
    textarea { width: 100%; height: 95px; background: #111; color: #00ff66; font-family: monospace; border: 1px solid #333; padding: 8px; resize: none; font-size: 11px; }
    .tree-item { padding: 5px; cursor: pointer; border-radius: 3px; font-size: 12px; margin-bottom: 2px; background: #252526; }
    .tree-item.selected { background: #094771; font-weight: bold; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; }
    .modal-card { width: 90%; max-width: 750px; height: 85vh; background: #252526; border-radius: 8px; padding: 20px; position: relative; }
  </style>
</head>
<body>

  <div id="editor-layout">
    <div id="toolbar">
      <b style="color:#ff7700;">STUDIO</b>
      <button onclick="createPrimitive('box')">+ Cube</button>
      <button onclick="createPrimitive('sphere')">+ Sphere</button>
      <button onclick="triggerGlbUpload()">+ Import GLB Model</button>
      <input type="file" id="glb-file-input" accept=".glb" style="display:none" onchange="handleGlbFileSelect(event)">
      
      <button style="margin-left:auto; background:#28a745;" onclick="exportAndOpenForm()">Submit to Google Form</button>
      <button onclick="window.location.href='./index.html'">Back to Game</button>
    </div>

    <div id="hierarchy"><div id="tree-root"></div></div>

    <div id="viewport-container">
      <a-scene embedded>
        <a-sky color="#1a1a2e"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#222" gridhelper="size: 30; divisions: 30;"></a-plane>
        <a-camera position="0 2 5" look-controls wasd-controls></a-camera>
        <a-entity id="user-scene"></a-entity>
      </a-scene>
    </div>

    <div id="inspector"><div id="inspector-content"><i>Select an item to edit.</i></div></div>

    <div id="bottom-panel">
      <textarea id="code-output" readonly placeholder="Room payload will appear here..."></textarea>
    </div>
  </div>

  <div id="form-modal" class="modal-overlay">
    <div class="modal-card">
      <button style="position:absolute; top:10px; right:10px; background:#d9534f;" onclick="document.getElementById('form-modal').style.display='none'">✕ Close</button>
      <iframe src="https://forms.gle/NdcGi2QNuVUTTE2Z6" style="width:100%; height:100%; border:none; margin-top:20px;"></iframe>
    </div>
  </div>

  <script>
    let sceneObjects = [];
    let selectedObjectId = null;

    // Convert Binary ArrayBuffer to Base256 String for JSON inclusion
    function bytesToBase256(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      let binaryStr = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binaryStr += String.fromCharCode(bytes[i]);
      }
      return binaryStr;
    }

    function createPrimitive(type) {
      const id = "obj_" + Date.now();
      const entity = document.createElement("a-entity");
      entity.setAttribute("id", id);
      entity.setAttribute("geometry", { primitive: type });
      entity.setAttribute("material", { color: "#ff7700" });
      entity.setAttribute("position", `0 ${1 + sceneObjects.length * 0.2} -2`);

      document.getElementById("user-scene").appendChild(entity);
      sceneObjects.push({ id, type, entity });
      updateHierarchy();
    }

    function triggerGlbUpload() { document.getElementById("glb-file-input").click(); }

    function handleGlbFileSelect(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        const base256Str = bytesToBase256(arrayBuffer);

        const id = "glb_" + Date.now();
        const blob = new Blob([arrayBuffer], { type: "model/gltf-binary" });
        const blobUrl = URL.createObjectURL(blob);

        const entity = document.createElement("a-entity");
        entity.setAttribute("id", id);
        entity.setAttribute("gltf-model", blobUrl);
        entity.setAttribute("position", "0 1 -2");

        document.getElementById("user-scene").appendChild(entity);
        sceneObjects.push({ id, type: "glb_base256", entity, base256Data: base256Str });
        updateHierarchy();
      };
      reader.readAsArrayBuffer(file);
    }

    function updateHierarchy() {
      const root = document.getElementById("tree-root");
      root.innerHTML = "";
      sceneObjects.forEach(obj => {
        const item = document.createElement("div");
        item.className = "tree-item";
        item.textContent = `${obj.type.toUpperCase()} (${obj.id.slice(-4)})`;
        root.appendChild(item);
      });
    }

    async function exportAndOpenForm() {
      const roomData = {
        metadata: { name: "Custom VR Quest", timestamp: new Date().toISOString() },
        entities: sceneObjects.map(obj => ({
          id: obj.id,
          type: obj.type,
          position: obj.entity.getAttribute("position"),
          base256Data: obj.base256Data || null
        }))
      };

      const jsonStr = JSON.stringify(roomData);
      document.getElementById("code-output").value = jsonStr;
      await navigator.clipboard.writeText(jsonStr);
      document.getElementById("form-modal").style.display = "flex";
    }
  </script>
</body>
</html>
