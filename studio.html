<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rec Engine - Studio Editor</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #ccc; }
    
    #editor-layout {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 40px 1fr 180px;
      height: 100vh;
    }

    #toolbar {
      grid-column: 1 / -1;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
      display: flex; align-items: center; padding: 0 10px; gap: 10px;
    }
    button {
      background: #3a3a3a; color: #fff; border: 1px solid #555; padding: 5px 12px;
      border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #007acc; border-color: #007acc; }

    #hierarchy {
      background: #252526; border-right: 1px solid #3c3c3c; padding: 10px; overflow-y: auto;
    }
    .panel-title { font-weight: bold; font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .tree-item { padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 13px; margin-bottom: 2px; }
    .tree-item:hover { background: #2a2d2e; }
    .tree-item.selected { background: #094771; color: #fff; }

    #viewport-container { position: relative; background: #111; grid-column: 2; grid-row: 2; }
    a-scene { width: 100%; height: 100%; }

    #inspector {
      background: #252526; border-left: 1px solid #3c3c3c; padding: 10px; grid-column: 3; grid-row: 2 / -1;
      overflow-y: auto;
    }
    .prop-group { margin-bottom: 15px; background: #2d2d2d; padding: 8px; border-radius: 4px; }
    .prop-row { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; font-size: 12px; }
    .prop-row label { width: 30%; }
    .prop-row input { width: 65%; background: #1e1e1e; border: 1px solid #3c3c3c; color: #fff; padding: 4px; border-radius: 3px; }
    .vector3 { display: flex; gap: 4px; width: 65%; }
    .vector3 input { width: 33%; text-align: center; }

    #bottom-panel {
      grid-column: 1 / 3; grid-row: 3; background: #1e1e1e; border-top: 1px solid #3c3c3c; padding: 10px;
    }
    textarea { width: 100%; height: 110px; background: #141414; color: #4af626; font-family: monospace; border: none; padding: 8px; border-radius: 4px; resize: none; }

    /* Embedded Google Form Modal Overlay */
    #form-modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 9999;
      justify-content: center; align-items: center; flex-direction: column;
    }
    #form-modal-content {
      position: relative; width: 90%; max-width: 700px; height: 85vh;
      background: #fff; border-radius: 8px; overflow: hidden;
    }
    #form-modal iframe { width: 100%; height: 100%; border: none; }
    .close-modal-btn {
      position: absolute; top: 10px; right: 15px; background: #ff3d00;
      color: #fff; font-weight: bold; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; z-index: 10000;
    }
  </style>
</head>
<body>

  <div id="editor-layout">
    <!-- Toolbar -->
    <div id="toolbar">
      <b style="color:#ffd700;">Studio Editor</b>
      <button onclick="createPrimitive('box')">+ Cube</button>
      <button onclick="createPrimitive('sphere')">+ Sphere</button>
      <button onclick="createPrimitive('cylinder')">+ Cylinder</button>
      <button onclick="createPrimitive('plane')">+ Plane</button>
      <button onclick="exportAndOpenForm()" style="margin-left:auto; background:#28a745; border-color:#28a745;">Submit to Google Form</button>
      <a href="./index.html" style="color:#fff; font-size:12px; text-decoration:none; margin-left:10px;">← Back to Game</a>
    </div>

    <!-- Hierarchy -->
    <div id="hierarchy">
      <div class="panel-title">Hierarchy</div>
      <div id="tree-root"></div>
    </div>

    <!-- 3D Viewport -->
    <div id="viewport-container">
      <a-scene embedded vr-mode-ui="enabled: false">
        <a-sky color="#222"></a-sky>
        <a-ambient-light color="#666"></a-ambient-light>
        <a-point-light position="2 4 3" intensity="0.8"></a-point-light>
        <a-camera id="editor-cam" position="0 2 5" look-controls wasd-controls></a-camera>
        <a-entity id="user-scene"></a-entity>
      </a-scene>
    </div>

    <!-- Inspector -->
    <div id="inspector">
      <div class="panel-title">Room Metadata</div>
      <div class="prop-group">
        <div class="prop-row"><label>Name</label><input type="text" id="room-name" value="My Custom Quest"></div>
        <div class="prop-row"><label>Owner</label><input type="text" id="room-owner" value="HeroPlayer"></div>
        <div class="prop-row"><label>Description</label><input type="text" id="room-desc" value="A cool custom room level."></div>
      </div>

      <div class="panel-title">Inspector</div>
      <div id="inspector-content"><i>Select an object to edit.</i></div>
    </div>

    <!-- JSON Output -->
    <div id="bottom-panel">
      <div class="panel-title">Exported JSON String</div>
      <textarea id="code-output" readonly placeholder="Generated JSON payload will appear here..."></textarea>
    </div>
  </div>

  <!-- Google Form Modal -->
  <div id="form-modal">
    <div id="form-modal-content">
      <button class="close-modal-btn" onclick="closeFormModal()">✕ Close</button>
      <!-- Embedded Google Form Link -->
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScyB-YJ0f316xXgWd_-r_Q1G6rG5-Vw8z_Example/viewform?embedded=true" id="form-iframe">Loading Form...</iframe>
    </div>
  </div>

  <script src="./js/studio.js"></script>
  <script>
    // Functions handling embedded form overlay and ZIP generation
    async function exportAndOpenForm() {
      const name = document.getElementById("room-name").value || "Untitled Room";
      const owner = document.getElementById("room-owner").value || "Anonymous";
      const desc = document.getElementById("room-desc").value || "No description.";

      // Build JSON Payload
      const roomData = {
        metadata: { name, owner, desc, timestamp: new Date().toISOString() },
        entities: sceneObjects.map(obj => ({
          id: obj.id,
          type: obj.type,
          position: obj.entity.getAttribute("position"),
          rotation: obj.entity.getAttribute("rotation"),
          scale: obj.entity.getAttribute("scale"),
          color: obj.entity.getAttribute("color")
        }))
      };

      const jsonString = JSON.stringify(roomData, null, 2);
      document.getElementById("code-output").value = jsonString;

      // Copy JSON string to Clipboard automatically
      try {
        await navigator.clipboard.writeText(jsonString);
        alert("Room JSON String copied to clipboard! Paste it into the form below.");
      } catch (err) {
        console.log("Could not auto-copy to clipboard: ", err);
      }

      // Generate local ZIP inside 'room data' directory structure
      const zip = new JSZip();
      const roomFolder = zip.folder("room data").folder(name.replace(/[^a-z0-9]/gi, '_').toLowerCase());
      roomFolder.file("info.txt", `NAME: ${name}\nOWNER: ${owner}\nDESCRIPTION: ${desc}`);
      roomFolder.file("room.json", jsonString);

      const blob = await zip.generateAsync({ type: "blob" });
      const downloadLink = document.createElement("a");
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = `${name.replace(/[^a-z0-9]/gi, '_')}_room_data.zip`;
      downloadLink.click();

      // Show embedded Google Form Modal
      document.getElementById("form-modal").style.display = "flex";
    }

    function closeFormModal() {
      document.getElementById("form-modal").style.display = "none";
    }
  </script>
</body>
</html>
