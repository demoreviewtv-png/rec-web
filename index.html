<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rec Engine - Dorm Room</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
    #fallback-ui { position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 10px; }
    .rr-btn { background: #ff8800; color: #fff; border: 3px solid #cc6600; padding: 10px 20px; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #cc6600; }
    .rr-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cc6600; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
    .modal-card { background: #222; border: 3px solid #ff8800; border-radius: 12px; padding: 20px; width: 90%; max-width: 500px; color: #fff; }
    .modal-card textarea { width: 100%; height: 120px; background: #111; color: #00ff66; border: 1px solid #444; font-family: monospace; border-radius: 6px; padding: 8px; box-sizing: border-box; }
    .close-btn { background: #d9534f; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }
  </style>
</head>
<body>

  <div id="fallback-ui">
    <button class="rr-btn" id="btn-open-rooms">Load Room JSON</button>
    <button class="rr-btn" onclick="window.location.href='./studio.html'">Maker Pen (Edit)</button>
  </div>

  <div id="room-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="close-btn" id="btn-close-modal">✕</button>
      <h3 style="margin-top:0; color:#ff8800;">Load Custom Room</h3>
      <textarea id="room-json-input" placeholder='Paste Room .JSON payload here...'></textarea>
      <button class="rr-btn" id="btn-instantiate" style="width:100%; margin-top:10px;">Instantiate Room</button>
    </div>
  </div>

  <a-scene webxr="optionalFeatures: hit-test, local-floor;" vr-mode-ui="enabled: true">
    <a-sky color="#87CEEB"></a-sky>
    <a-ambient-light color="#ffffff" intensity="0.6"></a-ambient-light>
    <a-directional-light position="3 10 5" intensity="0.8"></a-directional-light>

    <a-entity id="dorm-room">
      <a-plane position="0 0 0" rotation="-90 0 0" width="8" height="8" color="#a38c73"></a-plane>
      <a-box position="0 2 -4" width="8" height="4" depth="0.2" color="#e6dac3"></a-box>
      <a-box position="-4 2 0" width="0.2" height="4" depth="8" color="#e6dac3"></a-box>
      <a-box position="4 2 0" width="0.2" height="4" depth="8" color="#e6dac3"></a-box>
      <a-box position="2.5 0.3 -2.5" width="2" height="0.6" depth="3" color="#444"></a-box>
      <a-box position="2.5 0.7 -2.5" width="1.9" height="0.2" depth="2.9" color="#ff8800"></a-box>
    </a-entity>

    <a-entity id="dynamic-room-container"></a-entity>

    <!-- Player Rig -->
    <a-entity id="rig" position="0 0 1.5">
      <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls>
        <a-cursor color="#ff8800" raycaster="objects: .clickable; far: 5"></a-cursor>
      </a-camera>

      <!-- Left Controller / Hand -->
      <a-entity id="leftHand" hand-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable; far: 4">
        <a-entity id="watch-node" position="0 0.05 0.1" rotation="-45 90 0">
          <a-cylinder radius="0.05" height="0.02" color="#111"></a-cylinder>
          <a-circle id="watch-face" class="clickable" radius="0.04" position="0 0.011 0" rotation="-90 0 0" color="#333">
            <a-text value="WATCH" align="center" scale="0.15 0.15 0.15" color="#ff8800"></a-text>
          </a-circle>
        </a-entity>

        <!-- Watch Hologram Menu -->
        <a-entity id="watch-hologram" position="0.2 0.2 -0.1" rotation="0 45 0" visible="false">
          <a-plane width="0.6" height="0.4" color="#222" opacity="0.95">
            <a-text value="REC WATCH" position="-0.25 0.15 0.01" scale="0.3 0.3 0.3" color="#ff8800"></a-text>
            <a-box id="watch-btn-rooms" class="clickable" position="-0.15 0 0.01" width="0.25" height="0.1" depth="0.02" color="#007acc">
              <a-text value="ROOMS" align="center" position="0 0 0.02" scale="0.2 0.2 0.2"></a-text>
            </a-box>
            <a-box id="watch-btn-edit" class="clickable" position="0.15 0 0.01" width="0.25" height="0.1" depth="0.02" color="#ff8800">
              <a-text value="MAKER PEN" align="center" position="0 0 0.02" scale="0.2 0.2 0.2"></a-text>
            </a-box>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- Right Controller / Hand -->
      <a-entity id="rightHand" hand-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; far: 4"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const modal = document.getElementById("room-modal");
      const watchHolo = document.getElementById("watch-hologram");

      // UI Toggles
      document.getElementById("btn-open-rooms").onclick = () => modal.style.display = "flex";
      document.getElementById("btn-close-modal").onclick = () => modal.style.display = "none";
      
      document.getElementById("watch-face").addEventListener("click", () => {
        const vis = watchHolo.getAttribute("visible");
        watchHolo.setAttribute("visible", !vis);
      });

      document.getElementById("watch-btn-rooms").addEventListener("click", () => {
        modal.style.display = "flex";
      });

      document.getElementById("watch-btn-edit").addEventListener("click", () => {
        window.location.href = "./studio.html";
      });

      document.getElementById("btn-instantiate").onclick = () => {
        const raw = document.getElementById("room-json-input").value;
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          const container = document.getElementById("dynamic-room-container");
          container.innerHTML = "";

          (data.entities || []).forEach(ent => {
            const el = document.createElement("a-entity");
            el.setAttribute("position", ent.position || "0 0 0");
            el.setAttribute("rotation", ent.rotation || "0 0 0");
            el.setAttribute("scale", ent.scale || "1 1 1");

            if (ent.type === "glb_base256" && ent.base256Data) {
              const bytes = new Uint8Array(ent.base256Data.length);
              for (let i = 0; i < ent.base256Data.length; i++) bytes[i] = ent.base256Data.charCodeAt(i) & 0xFF;
              const blob = new Blob([bytes.buffer], { type: "model/gltf-binary" });
              el.setAttribute("gltf-model", URL.createObjectURL(blob));
            } else {
              el.setAttribute("geometry", { primitive: ent.type || "box" });
              el.setAttribute("material", { color: ent.color || "#ff8800" });
            }
            el.classList.add("clickable");
            container.appendChild(el);
          });
          modal.style.display = "none";
        } catch (e) {
          alert("Invalid JSON format!");
        }
      };
    });
  </script>
</body>
</html>
