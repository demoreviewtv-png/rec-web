<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rec Room Web - Game Room</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <script src="js/engine.js"></script>
  <script src="js/rro-games.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div id="controls-hint">
    [WASD] Walk | [Mouse] Look (Click to Pointer Lock) | [Left Click] Interact | Enter VR for Watch Menu
  </div>

  <a-scene physics="debug: false; gravity: -9.8">
    <a-sky color="#61C3FF"></a-sky>

    <!-- World Content Container -->
    <a-entity id="world-container"></a-entity>

    <!-- Player Rig with VR Hands -->
    <a-entity id="rig" movement-controls="fly: false; speed: 0.2" position="0 0 0">
      <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .selectable"></a-entity>
      </a-entity>

      <!-- VR Controllers -->
      <a-entity id="left-hand" hand-controls="hand: left; handModelStyle: lowPoly; color: #ff5722"></a-entity>
      <a-entity id="right-hand" hand-controls="hand: right; handModelStyle: lowPoly; color: #ff5722" raycaster="objects: .selectable" laser-controls="hand: right"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Boot default game or custom room payload
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');

      if (roomParam) {
        try {
          const raw = decodeURIComponent(roomParam);
          const parsed = JSON.parse(raw);
          const world = document.getElementById('world-container');
          
          // Floor base
          const floor = document.createElement('a-plane');
          floor.setAttribute('position', '0 0.01 0');
          floor.setAttribute('rotation', '-90 0 0');
          floor.setAttribute('width', '50');
          floor.setAttribute('height', '50');
          floor.setAttribute('color', '#1e293b');
          floor.setAttribute('static-body', '');
          world.appendChild(floor);

          parsed.forEach(obj => {
            const el = document.createElement(`a-${obj.type}`);
            el.setAttribute('position', obj.position);
            el.setAttribute('color', obj.color);
            el.setAttribute('dynamic-body', 'shape: auto');
            world.appendChild(el);
          });
        } catch (e) {
          console.error("Failed loading custom room:", e);
          RROGames.loadDodgeball();
        }
      } else {
        RROGames.loadDodgeball();
      }
    });
  </script>
</body>
</html>
