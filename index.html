<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#ff5722">
  <title>Rec Web</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="crosshair"></div>
  <button id="watch-toggle-btn" type="button" aria-label="Open watch">⌚</button>
  <div id="current-room-label">Rec Center Plaza</div>
  <button id="return-hub-btn" class="hidden" type="button">← Rec Center</button>
  <div id="hud-hint">WASD to move · Mouse to look · Click objects to interact · T for Watch</div>
  <div id="rro-toast"></div>

  <div id="watch-interface">
    <div class="watch-time" id="clock-display">00:00:00</div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="games">Games</button>
      <button class="tab-btn" data-tab="avatar">Avatar</button>
      <button class="tab-btn" data-tab="friends">Friends</button>
    </div>
    <section class="tab-content active" id="tab-home">
      <h3>Quick Actions</h3>
      <button class="btn-primary" id="open-pen-btn">Open Maker Pen</button>
      <button class="btn-primary btn-secondary" id="home-reset-btn">Reset Position</button>
      <button class="btn-primary btn-secondary" id="clear-build-btn">Clear My Builds</button>
    </section>
    <section class="tab-content" id="tab-games">
      <h3>Activities</h3>
      <div class="rro-card-grid">
        <button class="rro-card" data-game="hub"><span class="rro-icon">🏠</span><span class="rro-name">Rec Center</span></button>
        <button class="rro-card" data-game="dodgeball"><span class="rro-icon">🔴</span><span class="rro-name">Dodgeball</span></button>
        <button class="rro-card" data-game="paintball"><span class="rro-icon">🎨</span><span class="rro-name">Paintball</span></button>
        <button class="rro-card" data-game="goldentrophy"><span class="rro-icon">🏆</span><span class="rro-name">Golden Trophy</span></button>
      </div>
    </section>
    <section class="tab-content" id="tab-avatar">
      <h3>Avatar Color</h3>
      <div id="avatar-preview-wrap"><div id="avatar-preview"></div></div>
      <div class="swatch-grid">
        <button class="color-swatch" data-color="#ff5722" style="background:#ff5722"></button>
        <button class="color-swatch" data-color="#0284c7" style="background:#0284c7"></button>
        <button class="color-swatch" data-color="#22c55e" style="background:#22c55e"></button>
        <button class="color-swatch" data-color="#facc15" style="background:#facc15"></button>
        <button class="color-swatch" data-color="#ec4899" style="background:#ec4899"></button>
        <button class="color-swatch" data-color="#a855f7" style="background:#a855f7"></button>
      </div>
    </section>
    <section class="tab-content" id="tab-friends">
      <h3>Local Peer Room</h3>
      <div class="id-display" id="my-peer-id">Connecting…</div>
      <div class="friend-row">
        <input id="friend-id-input" placeholder="Friend peer ID" autocomplete="off">
        <button id="connect-friend-btn" type="button">Join</button>
      </div>
      <div class="player-count-badge">Players: <strong id="player-count">1</strong></div>
    </section>
  </div>

  <div id="maker-pen-ui">
    <div class="ui-header"><span class="ui-title">MAKER PEN</span><span class="ui-tag">BUILD</span></div>
    <div class="ink-container"><div class="ink-header"><span>INK</span><span id="ink-val">0%</span></div><div class="ink-track"><div id="ink-fill" class="ink-fill"></div></div></div>
    <div class="tool-grid">
      <button class="btn-tool active" id="tool-grab" type="button">Grab</button>
      <button class="btn-tool" id="tool-create" type="button">Create</button>
      <button class="btn-tool" id="tool-wire" type="button">Wire</button>
      <button class="btn-tool" id="tool-recolor" type="button">Color</button>
      <button class="btn-tool" id="tool-delete" type="button">Delete</button>
    </div>
    <label for="shape-select">Shape</label>
    <select id="shape-select"><option value="box">Cube</option><option value="sphere">Sphere</option><option value="cylinder">Cylinder</option><option value="cone">Cone</option></select>
    <label for="color-select">Color</label><input id="color-select" type="color" value="#ff5722">
    <button id="spawn-shape-btn" class="btn-primary" type="button">Spawn Object</button>
    <button id="close-pen-btn" class="btn-primary btn-secondary" type="button">Close</button>
  </div>

  <div id="mobile-controls" aria-hidden="true">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="mobile-jump" type="button">↑</button>
    <button id="mobile-use" type="button">USE</button>
  </div>

  <a-scene id="scene" renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true" background="color:#61c3ff">
    <a-sky color="#61C3FF"></a-sky>
    <a-plane position="0 -0.02 0" rotation="-90 0 0" width="100" height="100" color="#1e293b"></a-plane>
    <a-entity id="world-container"></a-entity>
    <a-entity id="build-container"></a-entity>
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled:true" wasd-controls="acceleration:45; fly:false" cursor="rayOrigin:mouse; fuse:false" raycaster="objects:.selectable; far:20"></a-entity>
      <a-entity id="hold-node" position="0 0 -2"></a-entity>
      <a-entity id="left-hand" laser-controls="hand:left" raycaster="objects:.selectable; far:20"></a-entity>
      <a-entity id="right-hand" laser-controls="hand:right" raycaster="objects:.selectable; far:20"></a-entity>
    </a-entity>
  </a-scene>

  <script src="js/rro-games.js"></script>
  <script src="js/makerpen.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
