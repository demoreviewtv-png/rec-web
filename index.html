<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Rec Room Web - Universal Engine</title>

  <style>
    :root {
      --rr-orange: #ff5722;
      --rr-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border: 2px solid #ffffff;
      background: var(--rr-orange);
      border-radius: 50%;
      z-index: 9998;
      pointer-events: none;
    }

    #hud-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9990;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      border: 1px solid #334155;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <!-- Load official stable A-Frame build -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="hud-overlay">Click canvas to lock mouse for WASD look | WebXR VR ready</div>

  <!-- Scene configured for cross-platform WebXR & Desktop PC rendering -->
  <a-scene 
    webxr="optionalFeatures: hit-test, local-floor;"
    renderer="antialias: true; colorManagement: true;"
    vr-mode-ui="enabled: true">
    
    <a-sky color="#61C3FF"></a-sky>

    <!-- Floor Plane -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#1e293b"></a-plane>

    <!-- World Objects -->
    <a-entity id="world-container">
      <a-box class="selectable" position="-1.5 1 -4" color="#ff5722" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
      <a-sphere class="selectable" position="0 1.2 -4" radius="0.6" color="#0284c7"></a-sphere>
      <a-cylinder class="selectable" position="1.5 1 -4" radius="0.4" height="1.2" color="#22c55e"></a-cylinder>
    </a-entity>

    <!-- Native A-Frame Camera Rig (No external movement plugin dependency) -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" 
                camera 
                position="0 1.6 0" 
                look-controls="pointerLockEnabled: true; reverseMouseDrag: false" 
                wasd-controls="acceleration: 30; fly: false">
        <a-cursor fuse="false" raycaster="objects: .selectable" color="#ff5722"></a-cursor>
      </a-entity>

      <!-- WebXR Laser Controllers -->
      <a-entity laser-controls="hand: left" raycaster="objects: .selectable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .selectable"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const hud = document.getElementById('hud-overlay');
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      if (isMobile) {
        hud.innerText = "Touch and drag screen to look around | Tap objects to interact";
      }

      // Ensure WASD input focus is maintained when clicking canvas
      scene.addEventListener('click', () => {
        if (scene.canvas) {
          scene.canvas.focus();
        }
      });

      // Handle WebXR VR Mode UI transitions cleanly
      scene.addEventListener('enter-vr', () => {
        hud.style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
      });

      scene.addEventListener('exit-vr', () => {
        hud.style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';
      });

      // Object interaction handler
      document.querySelectorAll('.selectable').forEach(el => {
        el.addEventListener('click', () => {
          const originalColor = el.getAttribute('color');
          el.setAttribute('material', 'color', '#facc15');
          setTimeout(() => el.setAttribute('material', 'color', originalColor), 300);
        });
      });
    });
  </script>
</body>
</html>
