<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rec Room Web - Universal Engine with Maker Pen</title>

  <style>
    :root {
      --rr-orange: #ff5722;
      --rr-blue: #0284c7;
      --rr-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      border: 2px solid #ffffff;
      background: var(--rr-orange);
      border-radius: 50%;
      z-index: 9998;
      pointer-events: none;
    }

    /* Maker Pen Studio UI Panel */
    #maker-pen-ui {
      position: absolute;
      top: 15px; right: 15px;
      width: 260px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      color: #ffffff;
      z-index: 9990;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ui-title { font-weight: bold; font-size: 0.9rem; color: var(--rr-orange); }
    .ui-tag { font-size: 0.65rem; background: var(--rr-blue); padding: 2px 6px; border-radius: 4px; }

    .ink-track {
      width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin: 4px 0 10px;
    }
    .ink-fill { width: 0%; height: 100%; background: var(--rr-orange); transition: width 0.2s; }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    button {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    button:hover { background: #334155; }
    button.active { background: var(--rr-orange); border-color: #ff784e; }

    label { font-size: 0.7rem; color: #94a3b8; display: block; margin-top: 6px; }
    select, input[type="color"] {
      width: 100%; margin-top: 2px; margin-bottom: 6px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 4px; padding: 4px;
    }

    #hud-overlay {
      position: absolute;
      bottom: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 9990;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid #334155;
      pointer-events: none;
    }
  </style>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="hud-overlay">WASD to Move | Click screen to focus | WebXR VR Ready</div>

  <!-- MAKER PEN UI -->
  <div id="maker-pen-ui">
    <div class="ui-header">
      <span class="ui-title">📐 MAKER PEN</span>
      <span class="ui-tag">CV2 ENGINE</span>
    </div>

    <div style="display:flex; justify-between; font-size: 0.7rem;">
      <span>INK USED</span>
      <span id="ink-val" style="margin-left:auto;">0%</span>
    </div>
    <div class="ink-track"><div id="ink-fill" class="ink-fill"></div></div>

    <div class="tool-grid">
      <button class="btn-tool active" id="tool-create" onclick="MakerPen.setTool('create')">✏️ Create</button>
      <button class="btn-tool" id="tool-wire" onclick="MakerPen.setTool('wire')">🔌 Wire</button>
      <button class="btn-tool" id="tool-recolor" onclick="MakerPen.setTool('recolor')">🎨 Color</button>
      <button class="btn-tool" id="tool-move" onclick="MakerPen.setTool('move')">🖐️ Move</button>
      <button class="btn-tool" id="tool-delete" onclick="MakerPen.setTool('delete')">🗑️ Del</button>
    </div>

    <label>Primitive Shape</label>
    <select id="shape-select">
      <option value="box">Cube</option>
      <option value="sphere">Sphere</option>
      <option value="cylinder">Cylinder</option>
    </select>

    <label>Color</label>
    <input type="color" id="color-select" value="#ff5722">

    <button style="width:100%; margin-top:4px;" onclick="MakerPen.spawnShape()">Spawn Shape</button>

    <label>CV2 Gizmos</label>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px;">
      <button onclick="MakerPen.spawnGizmo('rotator')">⚙️ Rotator</button>
      <button onclick="MakerPen.spawnGizmo('trigger')">🔲 Trigger</button>
    </div>
  </div>

  <a-scene webxr="optionalFeatures: hit-test, local-floor;" renderer="antialias: true; colorManagement: true;" vr-mode-ui="enabled: true">
    <a-sky color="#61C3FF"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#1e293b"></a-plane>

    <a-entity id="world-container"></a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 30">
        <a-cursor fuse="false" raycaster="objects: .selectable" color="#ff5722"></a-cursor>
      </a-entity>

      <a-entity laser-controls="hand: left" raycaster="objects: .selectable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .selectable"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const MakerPen = {
      activeTool: 'create',
      mapEntities: {},
      selectedWireSource: null,
      MAX_INK: 30,

      init() {
        this.startCircuitLoop();
      },

      setTool(tool) {
        this.activeTool = tool;
        document.querySelectorAll('.btn-tool').forEach(btn => btn.classList.remove('active'));
        const btn = document.getElementById(`tool-${tool}`);
        if (btn) btn.classList.add('active');
      },

      updateInk() {
        const count = Object.keys(this.mapEntities).length;
        const pct = Math.min(100, Math.round((count / this.MAX_INK) * 100));
        document.getElementById('ink-val').innerText = `${pct}%`;
        document.getElementById('ink-fill').style.width = `${pct}%`;
      },

      getSpawnPos() {
        const cam = document.getElementById('camera');
        const pos = new THREE.Vector3();
        const dir = new THREE.Vector3();
        cam.object3D.getWorldPosition(pos);
        cam.object3D.getWorldDirection(dir);
        
        // Spawn 2.5 units in front of view direction
        const spawnPos = pos.add(dir.multiplyScalar(-2.5));
        return `${spawnPos.x.toFixed(2)} ${Math.max(0.5, spawnPos.y).toFixed(2)} ${spawnPos.z.toFixed(2)}`;
      },

      spawnShape() {
        if (Object.keys(this.mapEntities).length >= this.MAX_INK) return alert("Room Ink Full!");
        const type = document.getElementById('shape-select').value;
        const color = document.getElementById('color-select').value;
        const id = 'obj_' + Date.now();
        this.createEntity({ id, type, color, position: this.getSpawnPos(), entityType: 'prop' });
      },

      spawnGizmo(gizmoType) {
        if (Object.keys(this.mapEntities).length >= this.MAX_INK) return alert("Room Ink Full!");
        const id = 'gizmo_' + Date.now();
        const position = this.getSpawnPos();

        if (gizmoType === 'rotator') {
          this.createEntity({ id, type: 'cylinder', color: '#0284c7', position, entityType: 'rotator', speed: 60 });
        } else if (gizmoType === 'trigger') {
          this.createEntity({ id, type: 'box', color: '#38bdf8', position, entityType: 'trigger' });
        }
      },

      createEntity(data) {
        const container = document.getElementById('world-container');
        const el = document.createElement(`a-${data.type}`);
        el.setAttribute('id', data.id);
        el.setAttribute('class', 'selectable');
        el.setAttribute('position', data.position);
        el.setAttribute('color', data.color);

        if (data.entityType === 'trigger') {
          el.setAttribute('material', `color: ${data.color}; transparent: true; opacity: 0.4`);
          el.setAttribute('geometry', 'width: 1.5; height: 1.5; depth: 1.5');
        } else if (data.entityType === 'rotator') {
          el.setAttribute('geometry', 'radius: 0.3; height: 0.3');
        }

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          this.handleInteraction(data.id);
        });

        container.appendChild(el);
        this.mapEntities[data.id] = data;
        this.updateInk();
      },

      handleInteraction(id) {
        const el = document.getElementById(id);
        if (!el) return;

        if (this.activeTool === 'delete') {
          el.remove();
          delete this.mapEntities[id];
          this.updateInk();
        } else if (this.activeTool === 'recolor') {
          const color = document.getElementById('color-select').value;
          el.setAttribute('color', color);
          if (this.mapEntities[id]) this.mapEntities[id].color = color;
        } else if (this.activeTool === 'move') {
          const pos = el.getAttribute('position');
          el.setAttribute('position', `${pos.x} ${pos.y + 0.3} ${pos.z}`);
        } else if (this.activeTool === 'wire') {
          this.wireCircuit(id);
        }
      },

      wireCircuit(targetId) {
        if (!this.selectedWireSource) {
          this.selectedWireSource = targetId;
          alert(`Source selected: [${targetId}]. Click another object to attach it!`);
        } else {
          const sourceEl = document.getElementById(this.selectedWireSource);
          const targetEl = document.getElementById(targetId);
          if (sourceEl && targetEl && this.selectedWireSource !== targetId) {
            sourceEl.appendChild(targetEl);
            targetEl.setAttribute('position', '0 0.8 0');
            alert(`Wired ${targetId} to Gizmo ${this.selectedWireSource}!`);
          }
          this.selectedWireSource = null;
        }
      },

      startCircuitLoop() {
        let lastTime = performance.now();
        const tick = (now) => {
          const dt = (now - lastTime) / 1000;
          lastTime = now;

          const cam = document.getElementById('camera');
          let playerPos = null;
          if (cam) {
            playerPos = new THREE.Vector3();
            cam.object3D.getWorldPosition(playerPos);
          }

          Object.values(this.mapEntities).forEach(data => {
            const el = document.getElementById(data.id);
            if (!el) return;

            // Rotator Logic
            if (data.entityType === 'rotator') {
              const rot = el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
              el.setAttribute('rotation', `${rot.x} ${(rot.y + data.speed * dt) % 360} ${rot.z}`);
            }

            // Trigger Zone Detection
            if (data.entityType === 'trigger' && playerPos) {
              const triggerPos = new THREE.Vector3();
              el.object3D.getWorldPosition(triggerPos);
              if (playerPos.distanceTo(triggerPos) < 1.2) {
                el.setAttribute('material', 'color: #ef4444; transparent: true; opacity: 0.7');
              } else {
                el.setAttribute('material', `color: ${data.color}; transparent: true; opacity: 0.4`);
              }
            }
          });

          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      MakerPen.init();

      const scene = document.querySelector('a-scene');
      scene.addEventListener('click', () => {
        if (scene.canvas) scene.canvas.focus();
      });

      scene.addEventListener('enter-vr', () => {
        document.getElementById('maker-pen-ui').style.display = 'none';
        document.getElementById('hud-overlay').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
      });

      scene.addEventListener('exit-vr', () => {
        document.getElementById('maker-pen-ui').style.display = 'block';
        document.getElementById('hud-overlay').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';
      });
    });
  </script>
</body>
</html>
