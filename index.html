<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rec Engine - Dorm Room</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    /* 2D Fallback UI */
    #fallback-ui { position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 10px; }
    .rr-btn { background: #ff8800; color: #fff; border: 3px solid #cc6600; padding: 10px 20px; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #cc6600; }
    .rr-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cc6600; }
  </style>
</head>
<body>

  <div id="fallback-ui">
    <button class="rr-btn" onclick="window.location.href='./studio.html'">Equip Maker Pen (Edit)</button>
  </div>

  <a-scene webxr="optionalFeatures: hit-test, local-floor;" vr-mode-ui="enabled: true">
    <a-sky color="#87CEEB"></a-sky>
    
    <!-- Lighting -->
    <a-ambient-light color="#ffffff" intensity="0.5"></a-ambient-light>
    <a-point-light position="0 3 0" intensity="0.6"></a-point-light>

    <!-- Dorm Room Environment -->
    <a-entity id="dorm-room">
      <!-- Floor & Walls -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="8" height="8" color="#a38c73"></a-plane>
      <a-box position="0 2 -4" width="8" height="4" depth="0.2" color="#e6dac3"></a-box>
      <a-box position="-4 2 0" width="0.2" height="4" depth="8" color="#e6dac3"></a-box>
      <a-box position="4 2 0" width="0.2" height="4" depth="8" color="#e6dac3"></a-box>

      <!-- Bed -->
      <a-box position="2.5 0.3 -2.5" width="2" height="0.6" depth="3" color="#444"></a-box>
      <a-box position="2.5 0.7 -2.5" width="1.9" height="0.2" depth="2.9" color="#ff8800"></a-box>
      <a-box position="2.5 0.8 -3.5" width="1.5" height="0.3" depth="0.8" color="#fff" radius="0.1"></a-box>

      <!-- Dorm Mirror Frame -->
      <a-box position="-3.9 1.5 -1.5" width="0.1" height="2" depth="1.5" color="#555"></a-box>
      <a-plane position="-3.8 1.5 -1.5" rotation="0 90 0" width="1.3" height="1.8" color="#88ccff" opacity="0.8"></a-plane>

      <!-- Whiteboard -->
      <a-box position="-1.5 1.5 -3.9" width="3" height="2" depth="0.1" color="#fff"></a-box>
      <a-text value="Welcome to your Dorm!\n- Grab the Maker Pen to create.\n- Open Watch to Play." position="-2.8 2 -3.8" color="#000" scale="0.5 0.5 0.5"></a-text>
    </a-entity>

    <!-- Rec Room Style "Bean" Player Rig -->
    <a-entity id="rig" position="0 0 1.5" movement-controls="fly: false">
      <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls>
        <a-cursor color="#ff8800" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <!-- Left Hand (Watch) -->
      <a-entity id="leftHand" hand-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable; far: 4">
        <!-- Floating Hand Mesh -->
        <a-sphere radius="0.06" color="#f1c27d" position="0 0 0"></a-sphere>
        
        <!-- Rec Room Watch -->
        <a-entity position="0 0.05 0.1" rotation="-45 90 0">
          <a-cylinder radius="0.05" height="0.02" color="#111"></a-cylinder>
          <a-ring radius-inner="0.04" radius-outer="0.05" position="0 0.011 0" rotation="-90 0 0" color="#ff8800"></a-ring>
          <a-circle class="clickable" radius="0.04" position="0 0.01 0" rotation="-90 0 0" color="#333" onclick="toggleWatchMenu()">
            <a-text value="MENU" align="center" scale="0.15 0.15 0.15" color="#ff8800"></a-text>
          </a-circle>
        </a-entity>

        <!-- Pop-up Watch Hologram UI (Hidden by default) -->
        <a-entity id="watch-hologram" position="0.2 0.2 -0.1" rotation="0 45 0" visible="false">
          <a-plane width="0.6" height="0.4" color="#222" opacity="0.9" border-radius="0.05">
            <a-text value="WATCH MENU" position="-0.25 0.15 0.01" scale="0.3 0.3 0.3" color="#ff8800"></a-text>
            
            <!-- Play Button -->
            <a-box class="clickable" position="-0.15 0 0.01" width="0.25" height="0.1" depth="0.02" color="#007acc" onclick="alert('Rooms menu opening...')">
              <a-text value="PLAY" align="center" position="0 0 0.02" scale="0.25 0.25 0.25"></a-text>
            </a-box>
            
            <!-- Backpack/Maker Pen Button -->
            <a-box class="clickable" position="0.15 0 0.01" width="0.25" height="0.1" depth="0.02" color="#ff8800" onclick="window.location.href='./studio.html'">
              <a-text value="BACKPACK" align="center" position="0 0 0.02" scale="0.25 0.25 0.25"></a-text>
            </a-box>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- Right Hand (Maker Pen) -->
      <a-entity id="rightHand" hand-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; far: 4">
        <!-- Floating Hand Mesh -->
        <a-sphere radius="0.06" color="#f1c27d" position="0 0 0"></a-sphere>
        
        <!-- Maker Pen Model -->
        <a-entity position="0 0.02 -0.1" rotation="45 0 0">
          <a-cylinder radius="0.02" height="0.15" color="#444"></a-cylinder>
          <a-cone radius-bottom="0.02" radius-top="0.005" height="0.05" position="0 0.1 0" color="#ff8800"></a-cone>
          <a-sphere radius="0.006" position="0 0.125 0" color="#00ff00"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    function toggleWatchMenu() {
      const holo = document.getElementById("watch-hologram");
      const isVisible = holo.getAttribute("visible");
      holo.setAttribute("visible", !isVisible);
    }
  </script>
</body>
</html>
